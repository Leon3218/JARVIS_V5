name: Build JARVIS Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Install and Generate Gradle Wrapper
      run: |
        sudo apt-get update
        sudo apt-get install -y gradle
        gradle wrapper --gradle-version 8.0
        chmod +x gradlew

    - name: Inject Safe Resources and Layout
      run: |
        mkdir -p app/src/main/res/values app/src/main/res/layout
        
        cat << 'EOF' > app/src/main/res/values/colors.xml
        <?xml version="1.0" encoding="utf-8"?>
        <resources>
            <color name="jarvis_bg">#0D0E15</color>
            <color name="jarvis_card">#1A1D2B</color>
            <color name="jarvis_text_primary">#FFFFFF</color>
            <color name="jarvis_text_secondary">#8A8D9B</color>
            <color name="jarvis_accent">#00E5FF</color>
        </resources>
        EOF

        cat << 'EOF' > app/src/main/res/layout/activity_main.xml
        <?xml version="1.0" encoding="utf-8"?>
        <FrameLayout xmlns:android="http://schemas.android.com/apk/res/android"
            android:layout_width="match_parent"
            android:layout_height="match_parent"
            android:background="#0D0E15">
            <TextView
                android:layout_width="wrap_content"
                android:layout_height="wrap_content"
                android:layout_gravity="center"
                android:text="JARVIS AI"
                android:textColor="#FFFFFF"
                android:textSize="24sp" />
        </FrameLayout>
        EOF

    - name: Build Debug APK
      run: ./gradlew assembleDebug --stacktrace

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: JARVIS-Debug-APK
        path: app/build/outputs/apk/debug/app-debug.apk
        
